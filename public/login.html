<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — AI Student Recommendation Engine</title>
<meta name="description" content="Sign in to your AI Student Recommendation Engine account to get personalized book and career guidance." />
<link rel="icon" href="assets/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2C2560" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="auth-shell">
  <aside class="auth-side">
    <a class="brand" href="index.html">
      <span class="brand-mark"></span>
      Advizor<span style="color:#A594FF">.ai</span>
    </a>
    <div class="auth-quote">
      <p>“The right book at the right moment can change the direction of a career.”</p>
      <span>— Every advisor who's ever mattered</span>
    </div>
    <div class="cc-mini card" style="background:rgba(255,255,255,0.06); border-color:rgba(255,255,255,0.14); padding:18px; border-radius:14px;">
      <div style="font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#A594FF; margin-bottom:10px;">Trusted by students in</div>
      <div style="display:flex; gap:18px; flex-wrap:wrap; font-size:13px; color:rgba(255,255,255,0.75);">
        <span>Computer Science</span><span>Design</span><span>Business</span><span>Data</span>
      </div>
    </div>
  </aside>

  <div class="auth-form-wrap">
    <div class="auth-form">
      <div class="top-toggle">
        <button class="theme-toggle" aria-label="Toggle dark mode"><span class="ti">☾</span></button>
      </div>
      <h1>Welcome back</h1>
      <p class="sub">Sign in to pick up your recommendations right where you left off.</p>

      <form id="login-form" novalidate>
        <div class="field" id="field-email">
          <label for="email">Email address</label>
          <input class="input" type="email" id="email" name="email" placeholder="you@university.edu" autocomplete="email" required />
          <span class="field-error"></span>
        </div>
        <div class="field" id="field-password">
          <label for="password">Password</label>
          <div class="pw-toggle">
            <input class="input" type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button">Show</button>
          </div>
          <span class="field-error"></span>
        </div>

        <button class="btn btn-primary btn-block" type="submit" id="login-submit">
          <span class="btn-label">Sign in</span>
          <svg class="spinner" width="16" height="16" viewBox="0 0 50 50" style="animation:spin 0.8s linear infinite"><circle cx="25" cy="25" r="20" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="90 60"/></svg>
        </button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="register.html">Create one</a></p>
    </div>
  </div>
</div>

<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>initLoginPage();</script>
</body>
</html>
